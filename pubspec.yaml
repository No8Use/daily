name: daily
description: "Daily habit and task tracker app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0

  # State management and dependency injection
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  get_it: ^9.3.0

  # Database
  drift: ^2.35.2
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  path: ^1.9.1

  # UI and utilities
  intl: ^0.20.3

  # Notifications
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.0

  # Import and export
  file_picker: ^13.1.0
  permission_handler: ^12.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  drift_dev: ^2.35.1

flutter:
  uses-material-design: true
